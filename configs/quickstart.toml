# Fastest possible smoke run of the full GQE pipeline: tiny N, tiny model,
# few epochs, the incremental (fast, CPU) evaluator. See examples/quickstart.py
# for the bare Python API these CLI commands wrap.

run_name = "quickstart"

[hamiltonian]
kind = "lmg"
n_qubits = 4
h = 1.0
lam = 1.5
gamma = 0.0

[pool]
kind = "pauli_pair"
connectivity = "all"

[model]
n_layer = 1
n_head = 2
n_embd = 16
dropout = 0.0

[train]
epochs = 30
seq_len = 6
seq_gen = 5
n_batches = 3
eval_sequences = 20
seed = 1
n_jobs = 1
evaluator = "incremental"
