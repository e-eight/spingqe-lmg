# Fig. dicke-showcase, zero-reference arms: lambda=1.5, L=12, 10 seeds per N.
#   variant "coarse": pool.angle_scale = 0  (unscaled vocabulary; not plotted)
#   variant "fine":   pool.angle_scale = 8  (8/N-rescaled vocabulary; plotted)
# n_qubits, seed and angle_scale are supplied per row by the sweep manifest.
# Runs: data/runs/dicke-showcase-zero-seeds-2026-08-06

run_name = "dicke-showcase-zero-seeds"

[hamiltonian]
kind = "lmg"
n_qubits = 1000
h = 1.0
lam = 1.5
gamma = 0.0

[pool]
kind = "collective"
connectivity = "all"
paulis = ["ZZ", "XX", "YY"]
include_single_z = true
angle_scale = 0

[model]
n_layer = 12
n_head = 8
n_embd = 512
dropout = 0.2
bias = false

[train]
epochs = 700
seq_gen = 10
seq_len = 12
n_batches = 10
temperature = 0.5
beta = 0.3
seed = 1
n_jobs = 16
energy_norm = "shift_scale"
init_state = "zero"
evaluator = "dicke"
